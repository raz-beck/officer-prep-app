<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>מיוני קצונה - למידה חכמה</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #27ae60;
            --accent: #e67e22;
            --error: #e74c3c;
            --bg: #f4f7f6;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 15px; 
            color: #333; 
            line-height: 1.6;
            -webkit-user-select: none; /* מניעת העתקת טקסט בטעות באייפון */
        }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); margin-bottom: 20px; border: 1px solid #eee; }
        h1 { color: var(--primary); text-align: center; font-size: 26px; margin-top: 20px; margin-bottom: 20px; }
        
        .progress-container { background: #eee; border-radius: 10px; height: 10px; margin: 15px 0; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, var(--secondary), #2ecc71); height: 100%; width: 0%; transition: width 0.4s ease; }
        
        .btn { display: block; width: 100%; padding: 18px; margin: 12px 0; border: none; border-radius: 15px; background: var(--primary); color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
        
        .option { display: block; background: #fff; border: 2px solid #e9ecef; padding: 18px; margin: 10px 0; border-radius: 15px; cursor: pointer; transition: all 0.2s; font-size: 17px; -webkit-tap-highlight-color: transparent; }
        .option:active { background: #f8f9fa; }
        .option.correct { background-color: #d4edda !important; border-color: var(--secondary) !important; color: #155724; }
        .option.wrong { background-color: #f8d7da !important; border-color: var(--error) !important; color: #721c24; }
        
        #feedback { text-align: center; font-weight: bold; margin-top: 15px; min-height: 30px; font-size: 18px; }
        .hidden { display: none; }
        .stats { font-size: 14px; text-align: center; color: #7f8c8d; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h1>🇮🇱 הכנה לקצונה</h1>
    
    <div id="mainMenu">
        <div class="card">
            <h3>תרגול מלא (200 שאלות)</h3>
            <p>השאלות יופיעו בסדר אקראי וללא חזרות. בסוף תקבלי ציון סופי.</p>
            <button class="btn" onclick="startQuiz()">התחילי עכשיו</button>
        </div>
    </div>

    <div id="quizArea" class="hidden">
        <div class="card">
            <div id="qCount" class="stats">שאלה ...</div>
            <div class="progress-container"><div class="progress-bar" id="pBar"></div></div>
            
            <h3 id="qText">טוען...</h3>
            <div id="optionsContainer"></div>
            
            <div id="feedback"></div>
            <button id="nextBtn" class="btn hidden" style="background: var(--secondary);" onclick="loadNextQuestion()">לשאלה הבאה ➔</button>
            <button class="btn" style="background: #95a5a6; font-size: 14px; padding: 10px; margin-top: 20px;" onclick="goToMenu()">חזור לתפריט</button>
        </div>
    </div>

    <div id="summaryArea" class="hidden">
        <div class="card" style="text-align: center;">
            <h2>סיימת את הסבב! 🎖️</h2>
            <div id="finalScore" style="font-size: 40px; margin: 20px 0; font-weight: bold; color: var(--secondary);"></div>
            <p>כל הכבוד על ההתמדה. רוצה לנסות שוב?</p>
            <button class="btn" onclick="startQuiz()">סיבוב חדש (סדר שונה)</button>
            <button class="btn" style="background: #95a5a6;" onclick="goToMenu()">חזרה למסך הראשי</button>
        </div>
    </div>

    <script>
        const allQuestions = [
    // === שער 1: ישראל ותעודת זהות: דמוקרטיה, חוק וממשל ===
    { q: "על פי פתח הדבר של האוגדן, איזה מסמך היסטורי מהווה את התשתית שעליה נשען מבנה החוברת?", options: ["פקודות מטכ\"ל", "חוק יסוד: כבוד האדם וחירותו", "מגילת העצמאות", "חוק השבות"], correct: 2 },
    { q: "מה היה שמן של חוברות הלימוד שליוו את תלמידי בתי הספר בתקופת היישוב ובשנותיה הראשונות של המדינה?", options: ["מקראות ישראל", "ילקוט המפקד", "שבילי הארץ", "בשער המדינה"], correct: 0 },
    { q: "על פי דברי דוד בן גוריון המופיעים באוגדן, מי קובע בסופו של דבר מה יעשה הצבא?", options: ["הרמטכ\"ל", "רצון המדינה והדרג המדיני", "מועצת הביטחון", "מפקד בה\"ד 1"], correct: 1 },
    { q: "איזה מאפיין של צה\"ל, המפורט באוגדן, מאפשר לו להישאר כמוקד של הסכמה רחבה ומחוץ למחלוקת פוליטית?", options: ["אופיו ההיררכי", "אופיו הא-פוליטי והייצוגי", "חובת השירות הקרבי", "כפיפותו המלאה לנשיא המדינה"], correct: 1 },
    { q: "מהי הרשות המחוקקת הרשמית והיחידה של מדינת ישראל?", options: ["הממשלה", "בית המשפט העליון", "כנסת ישראל", "נשיאות המדינה"], correct: 2 },
    { q: "כמה חברי כנסת מכהנים בכנסת ישראל על פי החוק?", options: ["100 חברים", "120 חברים", "61 חברים", "80 חברים"], correct: 1 },
    { q: "מהו תפקידה העיקרי של הרשות המבצעת בישראל?", options: ["לחוקק חוקים", "לפרש את החוקים", "ניהול ענייני המדינה וביצוע החוקים", "מינוי שופטים"], correct: 2 },
    { q: "מי עומד רשמית בראש הרשות המבצעת (הממשלה) בישראל?", options: ["נשיא המדינה", "יושב ראש הכנסת", "ראש הממשלה", "שר הביטחון"], correct: 2 },
    { q: "מהו תפקידה המרכזי של הרשות השופטת בישראל?", options: ["ביצוע החלטות הממשלה", "פירוש החוקים, עשיית צדק והגנה על שלטון החוק", "אישור התקציב הלאומי", "פיזור הכנסת"], correct: 1 },
    { q: "איזה בית משפט מהווה את הערכאה השיפוטית הגבוהה ביותר במדינת ישראל?", options: ["בית המשפט המחוזי", "בית הדין הצבאי לערעורים", "בית המשפט העליון", "בית הדין לעבודה"], correct: 2 },
    { q: "אילו שלושה רכיבים מופיעים בסמל הרשמי של מדינת ישראל?", options: ["מנורת שבעת הקנים, ענפי זית, והשם 'ישראל'", "דגל המדינה, מגן דוד והשם 'ישראל'", "אריה יהודה, לוחות הברית והשם 'ישראל'", "מנורה, יונה עם עלה זית ומגן דוד"], correct: 0 },
    { q: "מאיזה מקור היסטורי ארכיאולוגי נלקח עיצוב מנורת שבעת הקנים שבסמל המדינה?", options: ["ממצאים בעיר דוד", "תבליט מנורת המקדש בשער טיטוס ברומא", "פסיפס בבית הכנסת העתיק ביריחו", "מערות קומראן"], correct: 1 },
    { q: "מהו המקור ההיסטורי לצבעי הכחול והלבן של דגל מדינת ישראל?", options: ["צבעי השמיים והעננים בארץ", "צבעי הטלית היהודית המסורתית", "צבעי הבגדים של הלוחמים החשמונאים", "צבעי סמל שבט יהודה"], correct: 1 },
    { q: "מי חיבר את מילות שיר 'התקווה', שהפך להמנון הלאומי של מדינת ישראל?", options: ["שמואל כהן", "חיים נחמן ביאליק", "נפתלי הרץ אימבר", "אברהם שטרן"], correct: 2 },
    { q: "מי הלחין את הלחן המוכר של המנון המדינה 'התקווה'?", options: ["שמואל כהן", "נפתלי הרץ אימבר", "נעמי שמר", "משה דיין"], correct: 0 },
    { q: "באיזה קונגרס ציוני הושר השיר 'התקווה' לראשונה באופן רשמי כהמנון התנועה הציונית?", options: ["הקונגרס הראשון", "הקונגרס השישי", "הקונגרס השמונה-עשר", "הקונגרס העשרים"], correct: 1 },
    { q: "איזה חוק יסוד מעגן באופן רשמי את מעמדם של דגל המדינה, סמל המדינה וההמנון?", options: ["חוק יסוד: השפיטה", "חוק יסוד: כבוד האדם וחירותו", "חוק יסוד: ישראל – מדינת הלאום של העם היהודי", "חוק יסוד: הממשלה"], correct: 2 },
    { q: "כיצד מוגדרת שיטת המשטר של מדינת ישראל?", options: ["דמוקרטיה נשיאותית", "מונרכיה חוקתית", "דמוקרטיה פרלמנטרית", "אוליגרכיה פדרלית"], correct: 2 },
    { q: "מהו עקרון 'הפרדת הרשויות' העומד בבסיס המשטר הדמוקרטי בישראל?", options: ["הפרדת הצבא מהפוליטיקה", "חלוקת סמכויות השלטון בין שלוש רשויות נפרדות למניעת ריכוז כוח", "הפרדת הדת מהמדינה בהחלטות חוקתיות", "הפרדה בין השלטון המרכזי לשלטון המקומי"], correct: 1 },
    { q: "מהי המשמעות של עקרון 'ריבונות העם' בדמוקרטיה?", options: ["הנשיא הוא השליט הבלעדי", "העם הוא מקור הסמכות של השלטון, המבוטא באמצעות בחירות נציגים", "הצבא שולט בשם העם", "בית המשפט מייצג את רצון העם במינויים"], correct: 1 },
    { q: "מה קובע 'חוק השבות' שנחקק בשנת 1500?", options: ["כל אזרח ישראלי רשאי לחזור לארץ בכל עת", "כל יהודי בעולם זכאי לעלות לארץ ישראל ולקבל אזרחות", "חובת גיוס חובה על כל תושב חוזר", "אישור החזרת קרקעות לפליטים"], correct: 1 },
    { q: "מהם 'חוקי היסוד' במדינת ישראל?", options: ["חוקים זמניים שמתחלפים בכל כנסת", "חוקים המהווים את פרקי התשתית לחוקה העתידית של המדינה", "חוקים שנוסחו על ידי הרבנות הראשית בלבד", "חוקים הנוגעים לעבירות תנועה ועבירות קלות בלבד"], correct: 1 },
    { q: "מהו אופיו המרכזי של תפקיד נשיא המדינה בישראל?", options: ["תפקיד ביצועי בעל סמכויות חקיקה נרחבות", "תפקיד ייצוגי וממלכתי המשמש כסמל לאחדות העם", "ראש המטה הכללי של הצבא", "הסמכות העליונה לפירוש חוקי יסוד"], correct: 1 },
    { q: "מי הגוף המוסמך לבחור את נשיא המדינה בישראל?", options: ["כלל אזרחי המדינה בבחירות ישירות", "חברי כנסת ישראל", "שופטי בית המשפט העליון", "הרמטכ\"ל ואלופי המטה הכללי"], correct: 1 },
    { q: "לכמה שנים נבחר נשיא המדינה בישראל (החל מהתיקון לחוק בשנת 2000)?", options: ["4 שנים עם אפשרות להארכה", "קדנציה אחת בלבד של 7 שנים", "5 שנים עם אפשרות לשתי קדנציות", "10 שנים קבועות"], correct: 1 },
    { q: "מהי ההגדרה של פקודה בלתי חוקית (רגילה) בצבא?", options: ["פקודה שהחייל רשאי לסרב לה מיד", "פקודה המנוגדת לחוק אך החייל מחויב לציית לה, והאחריות המשפטית היא על המפקד", "פקודה שניתנה רק בכתב ומחייבת אישור שר", "פקודה שדגל שחור מתנוסס מעליה"], correct: 1 },
    { q: "איזה סוג פקודה מחייב חייל צה\"ל לסרב לבצעה באופן מיידי?", options: ["פקודה קשה לביצוע", "פקודה בלתי חוקית בעליל", "פקודה שניתנה בעל פה על ידי קצין זוטר", "פקודה שאינה מופיעה בפקודות מטכ\"ל"], correct: 1 },
    { q: "איזה גוף רשמי מוסמך לבקר את פעולות הממשלה, משרדי המדינה והגופים הציבוריים בישראל?", options: ["ועדת החוץ והביטחון", "מבקר המדינה", "נציב קבילות החיילים", "המוסד לבוררות"], correct: 1 },
    { q: "מהי המשמעות של המושג 'צבא עם' המאפיין את צה\"ל?", options: ["צבא שמורכב ממתנדבים בלבד", "צבא המגייס את שורותיו מכלל שכבות הציבור מכוח חוק גיוס חובה ומייצג את החברה", "צבא הפועל ללא פיקוח ממשלתי", "צבא שבו החיילים בוחרים את מפקדיהם"], correct: 1 },
    { q: "מי רשאי לבחור בבחירות הכלליות לכנסת במדינת ישראל?", options: ["כל אדם השוהה בארץ מעל 5 שנים", "כל אזרח ישראלי מגיל 18 ומעלה", "רק מי ששירת שירות צבאי או לאומי מלא", "כל תושב רשום מגיל 16 ומעלה"], correct: 1 },

    // === שער 2: תרבות ואמונה בישראל: יהדות, אסלאם, נצרות, דרוזים וחגים ===
    { q: "בשנת 2003, איזה פתרון פומבי הציעו הרב יעקב מדן והמשפטנית רות גביזון בנוגע לאופייה של השבת?", options: ["סגירה מוחלטת של כלל מוסדות התרבות והעסקים במדינה", "פתיחת מוסדות תרבות ופנאי בשבת לצד סגירת בתי עסק ומסחר", "הפעלת תחבורה ציבורית מלאה ללא הגבלות מסחריות", "ביטול הגדרת השבת כיום המנוחה הרשמי"], correct: 1 },
    { q: "מהם שלושת החלקים המרכיבים את קובץ התנ\"ך היהודי?", options: ["תורה, משנה, גמרא", "תורה, נביאים, כתובים", "הלכה, אגדה, מדרש", "חומש, סידור, מחזור"], correct: 1 },
    { q: "כמה ספרים נכללים בסך הכל בקובץ התנ\"ך המקובל בעולם היהודי?", options: ["12 ספרים", "24 ספרים", "36 ספרים", "50 ספרים"], correct: 1 },
    { q: "מהי 'תורה שבעל-פה' על פי המסורת וההגדרה באוגדן?", options: ["תרגום התנ\"ך לשפות זרות", "הפירושים, ההלכות והמסורות שנמסרו בעל פה לצד התורה שבכתב וקובצו במשנה ובתלמוד", "שירים ופיוטים שנכתבו בימי הביניים", "תפילות יום החול בלבד"], correct: 1 },
    { q: "איזה קובץ הלכתי ומשפטי מרכזי נערך ונחתם על ידי רבי יהודה הנשיא בשנת 220 לספירה?", options: ["התלמוד הבבלי", "המשנה", "שולחן ערוך", "ספר המצוות"], correct: 1 },
    { q: "ממה מורכב קובץ 'התלמוד' (הגמרא)?", options: ["מפסוקי התורה בלבד", "מדיונים ופירושים של האמוראים על דברי המשנה", "ממזמורי תהילים", "מסיפורי חסידים"], correct: 1 },
    { q: "מהו 'ספר ההלכה' המקיף והנפוץ ביותר שחיבר רבי יוסף קארו בצפת במאה ה-16?", options: ["משנה תורה לרמב\"ם", "שולחן ערוך", "ספר הזוהר", "ספר החינוך"], correct: 1 },
    { q: "מהו ה'סידור' במסורת היהודית?", options: ["ספר המרכז את סדר התפילות והברכות לימי החול ולשבת", "ספר חוקי המדינה", "ספר מפות ארץ ישראל", "ספר תולדות הציונות"], correct: 0 },
    { q: "מהו ה'מחזור' במסורת היהודית ומה ההבדל בינו לבין סידור?", options: ["ספר ללימוד קריאה לילדים", "ספר תפילות המיועד לחגים ומועדים מיוחדים (כמו ראש השנה ויום כיפור)", "ספר שבו כותבים את נהלי הצבא", "קובץ פקודות של הרבנות הצבאית"], correct: 1 },

    { q: "מה פירוש המושג 'תבליט' (Relief) בהקשר של קריאת מפה וטופוגרפיה?", options: ["הצבעים והסימנים המוסכמים של כבישים ובניינים במפה", "צורת פני השטח התלת-ממדיים (הרים, גבעות, ערוצים, עמקים) כפי שהם מיוצגים במפה באמצעות קווי גובה", "סוג הקרקע (חול, סלע, בוץ)", "המרחק האופקי המדויק בין שתי נקודות"], correct: 1 },

    { q: "מהו המושג 'אזימוט' (Azimuth) בניווט ובשימוש במצפן?", options: ["המרחק הפיזי שנותר להליכה בקילומטרים", "הזווית שבין קו הצפון (הצפון המגנטי או הרשתי) לבין קו הכיוון אל היעד, הנמדדת עם כיוון השעון במעלות (0-360)", "סוג של מצפן צבאי כבד", "נקודת המפגש בין שני צירי תנועה"], correct: 1 },
    { q: "מהו תפקידו של ה'נתק' במכשיר קשר צבאי אלחוטי?", options: ["להפסיק את זרימת החשמל ולכבות את המכשיר לחלוטין", "נוהל מיוחד המונע פריצת רשת והאזנת אויב על ידי ניתוק זמני של התדר", "לחבר את המכשיר לאנטנה חיצונית גבוהה", "להגביר את עוצמת השמע ברמקול"], correct: 1 },

    { q: "מהם שלושת המרכיבים המרכזיים של 'חוסן תקשורת' ואלחוט בצבא?", options: ["מהירות, עוצמה ויופי", "סודיות, אמינות ורציפות הקשר", "טעינה מהירה, משקל קל ותצוגה צבעונית", "מספר תדרים רב ללא נהלים"], correct: 1 },
    { q: "איזה חלק ברובה סער M16 אחראי על גריפת הכדור מהמחסנית, נעילתו בבית הבליעה וביצוע הנקירה?", options: ["ההדק", "המכלול (Bolt assembly)", "הקנה", "הפסתר"], correct: 1 },
    { q: "מהי הסכנה המרכזית בביצוע 'ירי יבש' (ללא כדורים) בנשק כאשר אין מקשר או תותב מתאים?", options: ["שבירה של הקת", "שחיקה ונזק לנוקר (הנוקר מכה על ריק ועשוי להישבר) או לבית הבליעה", "הרובה עלול להחליד במהירות", "המחסנית עלולה ליפול מהתושבת"], correct: 1 },
    { q: "מהו המושג 'טווח ראייה 2' בירי לילה עם כוונות ברזל על פי פקודות האוגדן המצורף?", options: ["הטווח המקסימלי שבו ניתן לראות כוכבים בשמיים", "הטווח המקסימלי שבו כלל המשתתפים במקצה הירי מזהים בבירור את המטרות בלילה, המשמש לאימונים בטוחים", "הטווח שבו האויב מזהה את רשף הנשק", "טווח של 100 מטרים קבועים תמיד"], correct: 1 },

    { q: "כיצד מטפלים בצורה נכונה ובטוחה ב'מעצור שני' ברובה M16?", options: ["מכה למחסנית וירי מיידי", "נועלים מכלול לאחור, מוציאים מחסנית, מנערים/מנקים את חלון הפליטה, מחזירים מחסנית, דורכים ויורים", "מפרקים את הקנה בשטח", "לוחצים על ההדק בכוח רב עד לשחרור"], correct: 1 }
];
        let shuffledQuestions = [];
        let currentIndex = 0;
        let score = 0;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz() {
            shuffledQuestions = shuffle([...allQuestions]);
            currentIndex = 0;
            score = 0;
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('summaryArea').classList.add('hidden');
            document.getElementById('quizArea').classList.remove('hidden');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentIndex >= shuffledQuestions.length) {
                showSummary();
                return;
            }

            const q = shuffledQuestions[currentIndex];
            document.getElementById('qText').innerText = q.q;
            document.getElementById('qCount').innerText = `שאלה ${currentIndex + 1} מתוך ${shuffledQuestions.length}`;
            document.getElementById('feedback').innerText = "";
            document.getElementById('nextBtn').classList.add('hidden');
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = "";
            
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = opt;
                div.onclick = () => checkAnswer(i, q.correct, div);
                container.appendChild(div);
            });
            
            updateProgressBar();
        }

        function checkAnswer(selected, correct, element) {
            const options = document.querySelectorAll('.option');
            options.forEach(o => o.onclick = null);

            if (selected === correct) {
                element.classList.add('correct');
                document.getElementById('feedback').innerHTML = "✅ נכון מאוד!";
                score++;
            } else {
                element.classList.add('wrong');
                options[correct].classList.add('correct');
                document.getElementById('feedback').innerHTML = "❌ לא נכון";
            }
            
            currentIndex++;
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function updateProgressBar() {
            const progress = (currentIndex / shuffledQuestions.length) * 100;
            document.getElementById('pBar').style.width = progress + '%';
        }

        function showSummary() {
            document.getElementById('quizArea').classList.add('hidden');
            document.getElementById('summaryArea').classList.remove('hidden');
            document.getElementById('finalScore').innerText = `${score} / ${allQuestions.length}`;
        }

        function goToMenu() {
            document.getElementById('mainMenu').classList.remove('hidden');
            document.getElementById('quizArea').classList.add('hidden');
            document.getElementById('summaryArea').classList.add('hidden');
        }
    </script>
